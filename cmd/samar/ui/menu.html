<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Senja — Tampilan taskbar</title><style>__CSS__</style></head>
<body><main class="panel" aria-label="Pengaturan Senja">
<header class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path fill="currentColor" d="M5 21a15 15 0 0 1 30 0H5Z"/><path d="M5 25h30M11 31h18" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg><div><h1>Senja</h1><p>Tampilan taskbar</p></div></header>
<fieldset class="styles"><legend>Pilih tampilan</legend><div class="style-grid" role="radiogroup" aria-label="Gaya taskbar">
<button class="style" role="radio" aria-checked="false" data-command="100" data-style="1"><svg class="style-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m7 15 5-6m0 6 5-6"/></svg><span><strong>Kaca</strong><small>Blur lembut</small></span><svg class="check" viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></button>
<button class="style" role="radio" aria-checked="false" data-command="101" data-style="2"><svg class="style-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M7 9h10M7 12h10M7 15h6"/></svg><span><strong>Akrilik</strong><small>Blur lebih pekat</small></span><svg class="check" viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></button>
<button class="style" role="radio" aria-checked="false" data-command="102" data-style="3"><svg class="style-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M8 9h3M8 12h8"/></svg><span><strong>Bening</strong><small>Transparan penuh</small></span><svg class="check" viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></button>
<button class="style" role="radio" aria-checked="false" data-command="103" data-style="4"><svg class="style-icon" viewBox="0 0 24 24"><path d="M4 5h7v6H4zm9 0h7v6h-7zM4 13h7v6H4zm9 0h7v6h-7z"/></svg><span><strong>Solid</strong><small>Gelap tanpa blur</small></span><svg class="check" viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></button>
</div></fieldset>
<section class="preferences" aria-label="Preferensi"><button class="setting" role="switch" aria-checked="false" data-command="105" id="rounded"><span>Sudut membulat</span><i class="switch" aria-hidden="true"><span class="switch-thumb"></span></i></button><button class="setting" role="switch" aria-checked="false" data-command="110" id="startup"><span>Mulai bersama Windows</span><i class="switch" aria-hidden="true"><span class="switch-thumb"></span></i></button></section>
<section class="quick-actions" aria-label="Tindakan aplikasi"><button class="action" data-command="111"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.4 8a7 7 0 0 1 11.8-2L20 9M4 15l2.8 3A7 7 0 0 0 18.6 16"/></svg><span>Segarkan taskbar</span></button>
<button class="action update-action" data-command="112" aria-label="Pembaruan: cek dan pasang versi terbaru"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span>Pembaruan</span><small>Cek &amp; pasang</small></button></section>
<footer><span class="save-status" id="status" role="status" aria-live="polite"></span><button class="exit" data-command="140">Keluar</button></footer>
</main><script>window.__SENJA_STATE__=__STATE__;</script><script>__JS__</script></body></html>
