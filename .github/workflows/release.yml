name: Build and release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        default: '1.0.0'
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $env:SENJA_NEURAL_DLL = (Resolve-Path native/bin/SenjaNoise.dll).Path
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          node --test scripts/test-menu-commands.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Menu command tests failed' }
          ./scripts/package-release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: Senja-Bar-windows-x64
          path: |
            dist/Senja-Bar-windows-x64.zip
            dist/Senja-Bar.exe
            dist/SHA256SUMS.txt
            dist/TranslucentTB-*-source.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/Senja-Bar.exe dist/Senja-Bar-windows-x64.zip dist/SHA256SUMS.txt dist/TranslucentTB-*-source.zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/Senja-Bar.exe dist/Senja-Bar-windows-x64.zip dist/SHA256SUMS.txt dist/TranslucentTB-*-source.zip --verify-tag --title "Senja Bar $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }

